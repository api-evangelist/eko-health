- name: Agent instructions
  url: https://www.ekohealth.com/agents.md
  status: 200
  file: ../llms/eko-health-agents.md
tools:
- name: search_catalog
  description: Search for products from the online store, hosted on Shopify. Supports natural language
    queries, specific filter criteria, or both; results are paginated.
  input_schema_properties:
  - meta
  - catalog
- name: get_product_details
  description: Look up a product by ID. Pass the options parameter to select a specific variant for the
    product card; without options the first available variant is returned.
  input_schema_properties:
  - product_id
  - options
  - country
  - language
- name: get_cart
  description: Get the cart including items, shipping options, discount info, and checkout url for a given
    cart id.
  input_schema_properties:
  - cart_id
- name: update_cart
  description: Perform updates to a cart, including adding/removing/updating line items, buyer information,
    shipping details, discount codes, gift cards and notes in one consolidated call.
  input_schema_properties:
  - cart_id
  - add_items
  - update_items
  - remove_line_ids
  - buyer_identity
  - delivery_addresses_to_add
  - delivery_addresses_to_replace
  - selected_delivery_options
  - discount_codes
  - gift_card_codes
  - note
- name: search_shop_policies_and_faqs
  description: Used to get facts about the store's policies, products, or services (return policy, shipping
    policy, contact details, and similar questions).
  input_schema_properties:
  - query
  - context
