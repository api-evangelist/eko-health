source: https://www.ekohealth.com/api/mcp
status: published
notes: Eko Health serves a live, anonymously reachable MCP server from its own www.ekohealth.com host.
  The implementation is the Shopify storefront / Universal Commerce Protocol (UCP) shopping service, advertised
  by Eko in its own /robots.txt, /agents.md and /llms.txt. An unauthenticated JSON-RPC tools/list returned
  HTTP 200 with five tools and full JSON input schemas, saved verbatim to eko-health-mcp-tools.json. This
  is a commerce surface for the Eko storefront, not the clinical Eko Connect device/recording API — that
  API (api.ekodevices.com) is auth-gated and publishes no MCP server.
server:
  name: eko-health-storefront
  transport: http
  url: https://www.ekohealth.com/api/mcp
  protocol: Model Context Protocol (JSON-RPC 2.0)
  authentication: none required for tools/list
  tools_file: eko-health-mcp-tools.json
related_endpoints:
- name: UCP MCP endpoint
  url: https://www.ekohealth.com/api/ucp/mcp
  status: gated
  evidence: 'POST tools/list returned HTTP 422 {"code":"invalid_profile_url","content":"Unable to fetch
    agent profile: Missing profile uri"} — the UCP transport requires a caller-supplied agent profile
    URI.'
- name: UCP discovery
  url: https://www.ekohealth.com/.well-known/ucp
  status: 200
