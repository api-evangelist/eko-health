aid: eko-health
name: Eko Health
description: 'Eko Health Inc. is an Oakland, California digital health company that
  builds FDA-cleared digital stethoscopes (CORE 500, CORE Digital Attachment, DUO,
  and the 3M Littmann CORE) together with cloud software and AI algorithms for the
  detection of cardiovascular and pulmonary disease. Its platform pairs the hardware
  with the Eko App (iOS/Android), the Eko web Dashboard, Eko AI murmur/AFib/low-ejection-fraction
  detection, and SENSORA, an enterprise AI cardiac disease detection platform for health
  systems. For integrators Eko publishes Eko Connect — an Enterprise SDK and API surface
  that live-streams auscultation audio and single-lead ECG into third-party telehealth,
  telemedicine cart, and life-science applications. The Enterprise SDK and its backing
  REST API at api.ekodevices.com are commercially gated: there is no public developer
  portal, OpenAPI, or self-serve documentation, and access is arranged through Eko sales.
  The company''s public agent-facing surface is its Shopify storefront, which serves a
  live anonymous MCP server, an agents.md / llms.txt, and Universal Commerce Protocol
  discovery.'
