apis:
- aid: eko-health:eko-storefront-mcp
  name: Eko Health Storefront MCP
  description: 'A live, anonymously reachable Model Context Protocol server published on
    Eko Health''s own www.ekohealth.com host, implementing the Shopify storefront /
    Universal Commerce Protocol (UCP) shopping service. A tools/list call returns five
    real tools with full JSON input schemas: search_catalog, get_product_details, get_cart,
    update_cart, and search_shop_policies_and_faqs. The store also publishes an agents.md
    (mirrored at /llms.txt), a UCP merchant profile at /.well-known/ucp, and OAuth/OIDC
    discovery documents that expose the customer-account-mcp-api:full scope. The parallel
    UCP MCP endpoint at /api/ucp/mcp requires an agent profile URI and returns a 422
    UCP discovery failure without one.'
  humanURL: https://www.ekohealth.com/agents.md
  baseURL: https://www.ekohealth.com/api/mcp
  tags:
  - MCP
  - Commerce
  - Agents
  properties:
  - type: MCPServer
    url: mcp/eko-health-mcp.yml
  - type: LLMsTxt
    url: llms/eko-health-llms.txt
- aid: eko-health:eko-connect
  name: Eko Connect Enterprise SDK and API
  description: 'Eko Connect is Eko Health''s integration surface for telehealth vendors,
    telemedicine cart makers, and life-science partners. It ships as native Android and
    iOS SDKs plus a REST API hosted at api.ekodevices.com that carries auscultation
    recordings, live audio/ECG streaming, and dashboard data. The service is real and
    live — an unauthenticated GET of /api/v1/recordings returns HTTP 401 — but the
    contract is commercially gated: Eko publishes no developer portal, no OpenAPI or
    Swagger document, and no self-serve documentation at any of the probed hosts, so
    integrators obtain the SDK and credentials through Eko sales. Its component health
    (Enterprise SDK, Enterprise SDK EAS, Enterprise SDK Livestream, Eko Dashboard,
    Eko Livestream, Eko Video) is published on the Eko status page.'
  humanURL: https://www.ekohealth.com/pages/telehealth-integrations
  baseURL: https://api.ekodevices.com
  tags:
  - SDK
  - Telehealth
  - Streaming
  - Medical Devices
