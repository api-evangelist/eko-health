  agreement through Eko sales, not from a public registry, so no `SDKs` pointer is wired
  in apis.yml. Everything named "eko" that IS on the registries belongs to unrelated
  companies (Eko India Financial Services, eko interactive video / @ekolabs, Fellou
  @eko-ai, and the NNPDF "eko" Evolution Kernel Operators Python package).
