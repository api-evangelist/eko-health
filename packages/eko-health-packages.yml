notes: >-
  No first-party Eko Health client library is published to any public package registry.
  Eko does ship real SDKs — the Eko Connect Enterprise SDK for Android and iOS, listed
  as monitored components on status.ekohealth.com ("Eko Enterprise SDK", "Enterprise SDK
